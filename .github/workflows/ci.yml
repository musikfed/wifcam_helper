name: WifCam Helper · Python 3.12 / i18n / secure bench
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax & runtime regression tests
        run: |
          python -m compileall -q wifcam_helper tests
          python -m py_compile scripts/lenya-image.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          bash -n scripts/publish-wiki.sh scripts/verify-host.sh scripts/check-factory-integration.sh
          python -m json.tool locales/strings.json >/dev/null
          python -m json.tool profiles/t23n_lean.json >/dev/null
      - name: Dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('wifcam_helper/ui.html').read_text(encoding='utf-8')
          assert html.count('<script>') == 1 and html.count('</script>') == 1
          js = html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/wifcam_helper_ui.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/wifcam_helper_ui.js
      - name: Refuse secrets and published media
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = {'.pem','.key','.wav','.pcm','.mp4','.img','.bin'}
          allowed_voice = Path('firmware/audio/boot-voice.wav')
          if allowed_voice.is_file():
              data = allowed_voice.read_bytes()
              assert len(data) < 1024 * 1024 and data[:4] == b'RIFF' and data[8:12] == b'WAVE'
          bad = [str(p) for p in Path('.').rglob('*') if p.is_file() and p.suffix.lower() in forbidden and '.git' not in p.parts and p != allowed_voice]
          assert not bad, bad
          PY
