<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PegineLab | WifCam Helper</title>
<style>
:root{--nav:#111827;--ink:#111827;--muted:#64748b;--blue:#2563eb;--line:#e2e8f0;--bg:#f2f5fa}*{box-sizing:border-box}
body{margin:0;font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}
.shell{display:grid;grid-template-columns:254px minmax(0,1fr);min-height:100vh}
aside{background:var(--nav);color:#e2e8f0;padding:25px 16px;display:flex;flex-direction:column;gap:25px}
.brand{display:flex;gap:12px;align-items:center}.symbol{background:var(--blue);font-weight:900;border-radius:14px;font-size:23px;width:45px;height:45px;display:grid;place-items:center}
.brand strong{display:block;color:white;font-size:18px}.brand small{display:block;color:#94a3b8;font-size:11px;line-height:1.3}
nav{display:grid;gap:7px}nav button{display:flex;align-items:center;gap:10px;text-align:left;width:100%;background:transparent;color:#cbd5e1;border:0;padding:12px;border-radius:10px;font-size:14px;cursor:pointer}
nav button:hover,nav button.active{background:#1d4ed8;color:white}.sidebar-bottom{margin-top:auto;font-size:12px;color:#94a3b8;display:grid;gap:12px}
main{padding:30px 35px;max-width:1550px;width:100%;min-width:0}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
h1{font-size:30px;letter-spacing:-.7px;margin:0}h2{font-size:21px;margin:0 0 13px}h3{font-size:17px;margin:0 0 8px}
.muted,small{color:var(--muted)}.badge{display:inline-flex;align-items:center;gap:8px;background:#dcfce7;color:#166534;border-radius:30px;padding:8px 13px;font-weight:700;font-size:12px}
select,input{font:inherit;width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:11px;background:white;color:#111827}
select{cursor:pointer}.language{width:180px}.hero{background:linear-gradient(110deg,#101e3a,#1d4ed8);padding:29px;border-radius:18px;color:white;position:relative;overflow:hidden}
.hero:after{content:"◉";position:absolute;right:36px;top:-65px;font-size:190px;opacity:.08}.hero small{color:#93c5fd;font-weight:800;letter-spacing:1.5px}.hero h2{font-size:31px;margin:5px 0}
.hero p{max-width:620px;color:#dbeafe}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:18px 0}
.card{background:white;border:1px solid var(--line);box-shadow:0 8px 24px #0f172a09;border-radius:15px;padding:22px;min-width:0}
.card .ico{font-size:23px;display:block;margin-bottom:9px}.card strong{display:block;font-size:17px}.card p{color:var(--muted);font-size:13px;margin:7px 0}
button.primary{background:var(--blue);color:white;padding:11px 16px;border-radius:9px;border:0;cursor:pointer;font:inherit;font-weight:700}
button.primary:disabled{opacity:.5;cursor:wait}.secondary{display:inline-block;background:#e2e8f0;color:#334155;padding:10px 13px;border-radius:9px;text-decoration:none;font-weight:700}
.panel{display:none}.panel.active{display:block}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
label{display:block;font-size:13px;color:#475569;font-weight:700;margin-bottom:5px}label span{display:block;margin-bottom:5px}
.test-row{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.consent{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid #bfdbfe;background:#eff6ff;border-radius:9px;margin:12px 0}
.consent input{width:18px;min-width:18px;margin:2px}.consent label{font-weight:500;cursor:pointer}
pre{background:#0e1729;color:#d1fae5;padding:17px;border-radius:13px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:410px;overflow-y:auto;font-size:12px}
.statusline{padding:12px;background:#eff6ff;border-radius:10px;color:#1d4ed8;margin:12px 0}
.footerline{font-size:12px;color:#64748b;margin-top:18px}
@media(max-width:940px){.shell{grid-template-columns:1fr}aside{padding:14px;gap:12px}nav{grid-template-columns:repeat(3,1fr)}.sidebar-bottom{display:none}main{padding:18px}.cards{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.cards,.formgrid{grid-template-columns:1fr}nav{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start;flex-direction:column}.language{width:100%}}
</style>
</head><body>
<div class="shell"><aside>
<div class="brand"><div class="symbol">P✦</div><div><strong>WifCam Helper</strong><small data-i18n="subtitle"></small></div></div>
<nav id="tabs"><button data-tab="overview" class="active">◈ <span data-i18n="overview"></span></button>
<button data-tab="capabilities">⚙ <span data-i18n="capabilities"></span></button>
<button data-tab="video">▶ <span data-i18n="video"></span></button>
<button data-tab="audio">♫ <span data-i18n="audio"></span></button>
<button data-tab="profiles">▤ <span data-i18n="profiles"></span></button>
<button data-tab="reports">⌁ <span data-i18n="reports"></span></button></nav>
<div class="sidebar-bottom"><div>CORE Huananzhi X79 · Ubuntu 24.04</div><div data-i18n="authNote"></div></div></aside>
<main><header><div><h1 id="pageTitle">WifCam Helper</h1><small data-i18n="model"></small></div>
<div class="language"><label for="locale" data-i18n="language"></label><select id="locale">
<option value="ru">Русский</option><option value="en">English</option><option value="be">Беларуская</option><option value="sah">Саха тыла</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="zh-CN">简体中文</option>
</select></div></header>
<section class="panel active" id="overview"><div class="hero"><small data-i18n="local"></small><h2 data-i18n="hero"></h2><p data-i18n="description"></p><span class="badge" data-i18n="safe"></span></div>
<div class="cards"><div class="card"><span class="ico">◉</span><strong data-i18n="camera"></strong><p data-i18n="model"></p></div>
<div class="card"><span class="ico">◈</span><strong data-i18n="video"></strong><p data-i18n="videoNote"></p></div>
<div class="card"><span class="ico">♫</span><strong data-i18n="assistant"></strong><p data-i18n="audioNote"></p></div></div>
<div class="card"><h2 data-i18n="notice"></h2><p data-i18n="protected"></p><p data-i18n="gpu"></p></div></section>
<section class="panel" id="capabilities"><div class="card"><h2 data-i18n="capabilities"></h2>
<div class="formgrid"><div><label for="host" data-i18n="host"></label><input id="host" placeholder="192.168.1.55" autocomplete="off"></div>
<div><label for="user" data-i18n="user"></label><input id="user" value="root" autocomplete="off"></div>
<div><label for="key" data-i18n="key"></label><input id="key" type="text" placeholder="~/.ssh/id_ed25519" autocomplete="off"></div></div>
<div class="test-row"><button class="primary" data-kind="inventory" data-i18n="inventory"></button></div>
<div class="statusline" id="inventoryNote" data-i18n="notice"></div></div></section>
<section class="panel" id="video"><div class="card"><h2 data-i18n="video"></h2>
<div class="formgrid"><div><label for="url" data-i18n="url"></label><input id="url" placeholder="rtsp://CAMERA_IP:554/ch0" autocomplete="off" spellcheck="false"></div>
<div><label for="transport" data-i18n="transport"></label><select id="transport"><option value="tcp">TCP</option><option value="udp">UDP</option></select></div></div>
<div style="margin-top:12px"><label for="altUrl" data-i18n="altUrl"></label><input id="altUrl" placeholder="rtsp://CAMERA_IP:554/ch1" autocomplete="off" spellcheck="false"></div>
<p class="muted" data-i18n="rtspHelp"></p><div class="test-row">
<button class="primary" data-kind="probe" data-i18n="probe"></button>
<button class="primary" data-kind="video" data-i18n="videoTest"></button>
<button class="primary" data-kind="compare" data-i18n="compare"></button></div>
<div class="formgrid" style="margin-top:16px"><div><label for="modelPath" data-i18n="visionModel"></label><input id="modelPath" placeholder="/models/yolo11n.pt" autocomplete="off"></div>
<div><label for="visionDevice" data-i18n="visionDevice"></label><select id="visionDevice"><option value="cpu">CPU</option><option value="cuda:0">RTX CUDA:0</option></select></div></div>
<div class="consent"><input id="visionConsent" type="checkbox"><label for="visionConsent" data-i18n="visionConsent"></label></div>
<div class="test-row"><button class="primary" data-kind="classification" data-i18n="visionTest"></button></div>
<div class="statusline" data-i18n="videoNote"></div></div></section>
<section class="panel" id="audio"><div class="card"><h2 data-i18n="audio"></h2>
<p class="muted" data-i18n="audioNote"></p>
<div class="consent"><input id="micConsent" type="checkbox"><label for="micConsent" data-i18n="micConsent"></label></div>
<div class="test-row"><button class="primary" data-kind="microphone" data-i18n="micTest"></button></div>
<div class="consent"><input id="speakerConsent" type="checkbox"><label for="speakerConsent" data-i18n="speakerConsent"></label></div>
<div class="test-row"><button class="primary" data-kind="speaker" data-i18n="speakerTest"></button></div>
<p class="muted" data-i18n="privacy"></p></div></section>
<section class="panel" id="profiles"><div class="card"><h2 data-i18n="profiles"></h2><p data-i18n="presetNote"></p>
<a class="secondary" href="/api/preset" download="wifcam-approved-candidate.json" data-i18n="preset"></a><p class="muted" data-i18n="protected"></p></div></section>
<section class="panel" id="reports"><div class="card"><h2 data-i18n="report"></h2><pre id="report"></pre>
<div class="test-row"><a id="helpLink" class="secondary" href="https://github.com/musikfed/wifcam_helper/tree/main/wiki" target="_blank" rel="noopener noreferrer" data-i18n="help"></a></div></div></section>
<div class="footerline">© PegineLab · WifCam Helper · localhost only · no automatic camera configuration changes</div></main></div>
<script>
'use strict';
const CSRF="__CSRF_TOKEN__";
let dict={},lang='ru',busy=false;
const el=id=>document.getElementById(id);
const all=s=>[...document.querySelectorAll(s)];
async function init(){
  dict=await (await fetch('/api/i18n',{cache:'no-store'})).json();
  try{lang=localStorage.getItem('wifcam.helper.lang')||'ru'}catch(_){}
  if(!dict[lang])lang='ru';
  el('locale').value=lang;
  translate();await loadReport();
}
function translate(){
  document.documentElement.lang=lang;
  all('[data-i18n]').forEach(node=>{let text=dict[lang]&&dict[lang][node.dataset.i18n];if(text)node.textContent=text});
  const active=all('nav button.active')[0];el('pageTitle').textContent=(dict[lang]||{})[active.dataset.tab]||'WifCam Helper';
  el('helpLink').href='https://github.com/musikfed/wifcam_helper/blob/main/wiki/Guide-'+(lang==='zh-CN'?'ZH-CN':lang.toUpperCase())+'.md';
}
all('nav button').forEach(b=>b.onclick=()=>{
  all('nav button').forEach(x=>x.classList.toggle('active',x===b));
  all('section.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab));
  translate();
});
el('locale').onchange=()=>{lang=el('locale').value;try{localStorage.setItem('wifcam.helper.lang',lang)}catch(_){}translate()};
async function loadReport(){
  try{const r=await (await fetch('/api/last',{cache:'no-store'})).json();
    el('report').textContent=Object.keys(r).length?JSON.stringify(r,null,2):dict[lang].noData;
  }catch(_){el('report').textContent=dict[lang].noData}
}
async function run(kind){
  if(busy)return;
  const payload={kind,host:el('host').value.trim(),user:el('user').value.trim(),
    key:el('key').value.trim(),url:el('url').value.trim(),alt_url:el('altUrl').value.trim(),transport:el('transport').value,
    mic_consent:el('micConsent').checked,speaker_consent:el('speakerConsent').checked,
    model:el('modelPath').value.trim(),device:el('visionDevice').value,vision_consent:el('visionConsent').checked};
  if(kind==='microphone'&&!payload.mic_consent){alert(dict[lang].micConsent);return}
  if(kind==='speaker'&&!payload.speaker_consent){alert(dict[lang].speakerConsent);return}
  if(kind==='classification'&&!payload.vision_consent){alert(dict[lang].visionConsent);return}
  busy=true;all('button[data-kind]').forEach(b=>b.disabled=true);
  el('report').textContent=dict[lang].running;
  try{
    const response=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json','X-Lab-Token':CSRF},body:JSON.stringify(payload)});
    const result=await response.json();
    if(!response.ok)throw Error(result.error||'Test failed');
    el('report').textContent=JSON.stringify(result,null,2);
  }catch(e){el('report').textContent=dict[lang].failed+': '+String(e.message)}
  finally{busy=false;all('button[data-kind]').forEach(b=>b.disabled=false);all('nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab==='reports'));all('section.panel').forEach(x=>x.classList.toggle('active',x.id==='reports'));translate()}
}
all('button[data-kind]').forEach(b=>b.onclick=()=>run(b.dataset.kind));
init().catch(e=>{el('report').textContent=String(e)});
</script></body></html>
